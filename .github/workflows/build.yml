name: Build HNProxy iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Ambil Kode dari Repository
        uses: actions/checkout@v4

      - name: Buat Project Xcode Otomatis
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compile Aplikasi iOS
        run: |
          xcodebuild -project HNProxyApp.xcodeproj \
            -scheme HNProxyApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Kemas Menjadi File .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HNProxyApp.app Payload/
          zip -r HNProxy.ipa Payload

      - name: Simpan File .ipa agar Bisa Di-download
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-HNProxy-iOS
          path: HNProxy.ipa
